<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Jogo do Quadrado Mágico (Soma 15)</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    body {
      background: linear-gradient(135deg, #1e3c72, #2a5298);
      color: #fff;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 20px;
    }

    h1 {
      margin-bottom: 10px;
      text-shadow: 2px 2px 4px rgba(0,0,0,0.3);
    }

    p.instrucoes {
      margin-bottom: 25px;
      text-align: center;
      max-width: 450px;
      line-height: 1.4;
      opacity: 0.9;
    }

    /* Tabuleiro 3x3 */
    .board {
      display: grid;
      grid-template-columns: repeat(3, 90px);
      grid-template-rows: repeat(3, 90px);
      gap: 10px;
      background-color: rgba(255, 255, 255, 0.1);
      padding: 15px;
      border-radius: 12px;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.3);
    }

    .cell {
      width: 90px;
      height: 90px;
      font-size: 2.2rem;
      font-weight: bold;
      text-align: center;
      border: 2px solid #ffffff44;
      border-radius: 8px;
      background-color: #ffffff1a;
      color: #fff;
      outline: none;
      transition: all 0.2s ease;
    }

    .cell:focus {
      border-color: #f39c12;
      background-color: #ffffff33;
      box-shadow: 0 0 10px #f39c12;
    }

    /* Esconde as setinhas padrão dos inputs numéricos */
    .cell::-webkit-outer-spin-button,
    .cell::-webkit-inner-spin-button {
      -webkit-appearance: none;
      margin: 0;
    }
    .cell[type=number] {
      -moz-appearance: textfield;
    }

    /* Mensagem e Botoes */
    .actions {
      margin-top: 25px;
      display: flex;
      gap: 15px;
    }

    button {
      padding: 12px 24px;
      font-size: 1rem;
      font-weight: bold;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      transition: transform 0.1s, background-color 0.2s;
    }

    button:hover {
      transform: scale(1.05);
    }

    .btn-check {
      background-color: #2ecc71;
      color: #fff;
    }

    .btn-reset {
      background-color: #e74c3c;
      color: #fff;
    }

    #message {
      margin-top: 20px;
      font-size: 1.2rem;
      font-weight: bold;
      min-height: 30px;
      text-align: center;
    }

    .success {
      color: #2ecc71;
      text-shadow: 0 0 8px rgba(46, 204, 113, 0.5);
    }

    .error {
      color: #e74c3c;
      text-shadow: 0 0 8px rgba(231, 76, 60, 0.5);
    }
  </style>
</head>
<body>

  <h1>Quadrado Mágico</h1>
  <p class="instrucoes">
    Preencha o tabuleiro com números de **1 a 9** (sem repetir). <br>
    A soma de cada linha, coluna e diagonal deve ser exatamente **15**!
  </p>

  <!-- Grade 3x3 -->
  <div class="board">
    <input type="number" min="1" max="9" class="cell" id="c0" />
    <input type="number" min="1" max="9" class="cell" id="c1" />
    <input type="number" min="1" max="9" class="cell" id="c2" />
    <input type="number" min="1" max="9" class="cell" id="c3" />
    <input type="number" min="1" max="9" class="cell" id="c4" />
    <input type="number" min="1" max="9" class="cell" id="c5" />
    <input type="number" min="1" max="9" class="cell" id="c6" />
    <input type="number" min="1" max="9" class="cell" id="c7" />
    <input type="number" min="1" max="9" class="cell" id="c8" />
  </div>

  <div class="actions">
    <button class="btn-check" onclick="validarJogo()">Verificar</button>
    <button class="btn-reset" onclick="limparTabuleiro()">Reiniciar</button>
  </div>

  <div id="message"></div>

  <script>
    function validarJogo() {
      const msg = document.getElementById('message');
      const valores = [];

      // Ler valores dos inputs
      for (let i = 0; i < 9; i++) {
        const val = parseInt(document.getElementById(`c${i}`).value);
        if (isNaN(val) || val < 1 || val > 9) {
          msg.className = 'error';
          msg.textContent = 'Preencha todas as 9 células com números de 1 a 9!';
          return;
        }
        valores.push(val);
      }

      // Verificar se há números repetidos
      const numerosUnicos = new Set(valores);
      if (numerosUnicos.size !== 9) {
        msg.className = 'error';
        msg.textContent = 'Não pode repetir números! Use todos os números de 1 a 9.';
        return;
      }

      // Atribuição para fácil leitura da matriz
      // [0, 1, 2]
      // [3, 4, 5]
      // [6, 7, 8]
      const [v0, v1, v2, v3, v4, v5, v6, v7, v8] = valores;

      // Cálculo das somas
      const somas = [
        // Linhas
        v0 + v1 + v2,
        v3 + v4 + v5,
        v6 + v7 + v8,
        // Colunas
        v0 + v3 + v6,
        v1 + v4 + v7,
        v2 + v5 + v8,
        // Diagonais
        v0 + v4 + v8,
        v2 + v4 + v6
      ];

      // Verificar se TODAS as somas dão 15
      const acertou = somas.every(soma => soma === 15);

      if (acertou) {
        msg.className = 'success';
        msg.textContent = '🎉 Parabéns! Você resolveu o Quadrado Mágico!';
      } else {
        msg.className = 'error';
        msg.textContent = '❌ A soma de algumas linhas, colunas ou diagonais ainda não deu 15. Tente novamente!';
      }
    }

    function limparTabuleiro() {
      for (let i = 0; i < 9; i++) {
        document.getElementById(`c${i}`).value = '';
      }
      const msg = document.getElementById('message');
      msg.textContent = '';
      msg.className = '';
    }
  </script>
</body>
</html>
